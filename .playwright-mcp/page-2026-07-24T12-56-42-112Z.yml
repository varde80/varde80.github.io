        - heading "About Our Lab" [level=2] [ref=f1e47]
        - paragraph [ref=f1e48]: Our lab conducts research on AI for materials and processing. We work on property prediction, automation and acceleration of materials analysis, materials design, and process optimization by leveraging data generated from autonomous laboratories and computational science. By integrating these data sources with advanced AI models, we aim to develop innovative and efficient solutions for next-generation materials research.
