              - generic [ref=f10e242]:
                - heading "Abstract" [level=2] [ref=f10e243]
                - generic [ref=f10e245]:
                  - text: A data-driven acoustic emission (AE) framework with multimodal validation is proposed to resolve micromechanical damage evolution in a particle-reinforced metal matrix composite, B
                  - subscript [ref=f10e246]: "4"
                  - text: C/AA6061, under uniaxial tension. AE waveforms are represented using wavelet packet transform–based spectral features and analyzed through a hierarchical unsupervised workflow. A key feature of the framework is the establishment of a matrix-referenced baseline using pre-fracture AE data from monolithic AA6061, enabling objective separation of matrix-dominant and particle-dominant acoustic activity based on autoencoder reconstruction error. The particle-dominant subset is further partitioned into statistically distinct clusters with characteristic spectral signatures and strain-stage dependence. To provide physical interpretation and validation, complementary
                  - emphasis [ref=f10e247]: in situ
                  - text: techniques are employed.
                  - emphasis [ref=f10e248]: In situ
                  - text: scanning electron microscopy (SEM) reveals the initiation and progression of reinforcement-associated damage, including interfacial decohesion and particle cracking.
                  - emphasis [ref=f10e249]: In situ
                  - text: neutron diffraction (NED) quantifies phase-specific lattice-strain evolution and captures the development of deformation partitioning between the Al matrix and B
                  - subscript [ref=f10e250]: "4"
                  - text: C reinforcement. A clear correspondence is identified between the accelerated accumulation of particle-dominant AE activity and the increase in lattice-strain divergence during post-yield deformation, indicating progressive degradation of deformation compatibility. The integrated AE–SEM–NED analysis demonstrates that the proposed framework enables time-resolved and phase-sensitive interpretation of micromechanical damage evolution without relying on predefined signal labels. The approach provides a physically grounded basis for tracking reinforcement-associated damage and its coupling to phase-level deformation behavior in particle-reinforced metal matrix composites.
