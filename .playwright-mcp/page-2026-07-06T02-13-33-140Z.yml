              - generic [ref=e214]:
                - heading "Abstract" [level=2] [ref=e215]
                - generic [ref=e217]: Keyhole-driven metal melting during high-energy-density laser processing represents an extreme manufacturing regime governed by the dynamic stability of the keyhole. Keyhole collapse is the primary pathway for pore-defect formation. External electromagnetic fields offer a promising route for process control, and their effects are often intrinsically stabilizing. However, their interaction with melt-flow dynamics can be destabilized. This study investigates the under-explored governing mechanisms of the influence of electromagnetic fields on keyhole dynamics. We establish Lorentz-force alignment as a factor governing keyhole instability and show that pore-defect formation is dictated not only by the magnitude of the force but by the coupling between the electromagnetic force and intrinsic melt-flow topology. Using high-fidelity multiphysics simulations that resolve the recoil pressure, Marangoni convection, free-surface dynamics, and thermoelectric magnetohydrodynamics, we identify three characteristic configurations of Lorentz force–melt flow alignment. The transition to cavity collapse is suppressed when the Lorentz force counteracts the recirculation responsible for geometric necking. In contrast, co-alignment between the Lorentz force and dominant recirculation melt-flow patterns enhances the downward momentum flux and accelerates collapse events. Orthogonal alignment between the Lorentz force and dominant recirculation melt-flow patterns redistributes the lateral momentum without fully suppressing the dominant recirculation melt-flow patterns. Directional force–velocity correlation analysis reveals that electromagnetic fields selectively redistribute momentum, establishing Lorentz-force alignment as a factor governing instability transitions. These findings provide a mechanistic framework for understanding keyhole stability and establish a generalized pathway for electromagnetic cavity-stability control in laser metal melting.
