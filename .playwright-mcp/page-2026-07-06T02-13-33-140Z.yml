            - generic [ref=e237]:
              - heading "Introduction" [level=2] [ref=e238]
              - generic [ref=e239]:
                - generic [ref=e240]: Laser metal melting processes, including additive manufacturing and deep-penetration welding [[1], [2], [3], [4]], represent high-energy-density manufacturing regimes governed by the dynamic stability of the keyhole [[5], [6], [7], [8]]. The destabilization of this cavity results in pore entrapment and heterogeneous microstructure formation [[9], [10], [11]], generating defects that degrade mechanical performance [[12], [13], [14]]. The formation of keyhole-induced pores is intrinsically linked to nonlinear interactions between parameters and factors such as recoil pressure [15,16], convection driven by surface tension [17,18], and vapor–liquid interface oscillations [19]. Despite substantial progress in process optimization, the issue of pore-defect formation persists [20,21].
                - generic [ref=e241]: Current keyhole instability models primarily attribute pore-defect formation to excessive energy input or hydrodynamic fluctuations. They often emphasize the magnitude of driving factors, such as recoil pressure or Marangoni convection [[22], [23], [24], [25]]. However, pore-defect formation in keyholes is also driven by the redistribution of momentum near cavity walls and solid–liquid interfaces [[26], [27], [28]]. In particular, melt recirculation is a dominant contributor to necking [29,30], geometric narrowing [31,32], and subsequent pore entrapment [33,34]. Therefore, the accurate prediction of pore-defect formation requires resolving competing body forces that contribute to the reorganization of melt transport pathways and the triggering or suppression of instability transitions [35,36].
                - generic [ref=e242]: External magnetic fields provide a unique physical perturbation to control pore-defect formation in high-energy-density melt environments [37,38]. Thermoelectric currents form naturally in electrically conductive melts with steep thermal gradients [39,40]. The coupling of an applied magnetic flux with these currents induced Lorentz forces, producing a thermoelectric magnetohydrodynamic (TEMHD) flow and introducing additional body-force terms in the momentum balance [41,42]. Previous experimental and numerical studies have demonstrated that magnetic fields can alter the penetration depth, keyhole oscillation behavior, and porosity in laser metal melting processes [43,44]. In particular, experimental studies have shown that magnetic fields can effectively influence microstructures, mechanical properties, and pore-defect formation. Zhao et al. [45] and Zhou et al. [46] showed that magnetic fields can tailor grain texture and crystallographic orientation in laser powder bed fusion (LPBF)-fabricated alloys. Du et al. [47,48] reported that static magnetic fields lead to densification and grain refinement of AlSi10Mg alloys. These studies primarily focused on microstructural outcomes rather than the underlying melt-pool dynamics. Regarding pore-defect mitigation, Hu et al. [49] demonstrated that improved pore escape behavior and dense coating can be easily achieved without adjusting process parameters. Further, Yadav et al. [50] showed that magnetic fields can reduce porosity and enhance melt quality, although the governing flow mechanisms responsible for these improvements were not explicitly clarified. Li et al. [51] and Xu et al. [52] reported improvements in the melt morphology and keyhole stability due to the application of the magnetic field. However, their interpretations remained largely phenomenological. More recently, Fan et al. [53] provided direct experimental evidence that magnetic fields can actively modulate keyhole instability. Meanwhile, Fan et al. [54] proposed thermoelectric magnetohydrodynamic control strategies to manipulate melt-pool flow. However, these efforts emphasized observable effects and control outcomes, and did not fully characterize the interaction between Lorentz forces and intrinsic flow structures.
                - generic [ref=e243]: Although experimental studies provide valuable insights into magnetic-field-assisted laser metal melting, they are often expensive and time-consuming [[55], [56], [57], [58]]. Moreover, the optimal magnetic-field conditions cannot be guaranteed through simple trial-and-error experiments. Therefore, numerous simulation studies have focused on understanding the mechanisms underlying the effects of magnetic field on keyhole stability and estimating optimal process parameters. Chen et al. [59] and Chen et al. [60] incorporated thermoelectric currents in simulations to capture the effects of electromagnetic fields on melt-pool flow and microstructure evolution, primarily focusing on coupled thermal–electrical interactions rather than detailed flow structures. Similarly, Bachmann et al. [61] performed one of the earliest systematic studies on the Hartmann effect in laser-beam welding in the presence of steady magnetic fields. Their numerical and experimental analyses demonstrated that magnetic fields suppress melt convection through electromagnetic damping, modifying melt-pool flow and penetration behaviors. Notably, this work already implied that magnetic-field orientation influences melt-flow behavior. Meanwhile, the Lorentz force was primarily thought to hinder the overall melt-flow intensity. The study did not explicitly clarify whether the Lorentz force acted parallel or perpendicular to the dominant recirculation melt-flow patterns responsible for rear-wall instability. Wang and Yan [62] proposed a comprehensive TEMHD framework for laser-based additive manufacturing. Their model incorporated thermoelectric currents, Lorentz forces, and thermal-fluid transport. However, the effects of electromagnetic fields were primarily thought to be the global redistribution of heat, momentum, and convection intensity. The model did not establish a mechanistic framework linking the direction of Lorentz forces to instability transition, recirculation topology, or rear-wall collapse dynamics. Cao et al. [63] investigated the influence of magnetic fields on melt-pool flow during the laser welding of aluminum alloys. Their study showed that magnetic fields alter melt-flow circulation patterns, melt-pool morphology, and thermal transport behavior. Although different flow structures were observed in the presence of the magnetic field, the discussion focused on flow modification and convection suppression. More recent studies have extended these approaches to more complex process conditions. Zhou et al. [64] and Wang et al. [65] explored the effects of magnetic fields on microstructural evolution and particle–melt interactions. Meanwhile, Mei et al. [66] and Zeng et al. [67] examined dynamic melt-pool flow under varying magnetic-field configurations, including alternating fields. Further, Liu et al. [68] explicitly demonstrated that magnetic-field orientation strongly governs porosity in the deep-penetration laser welding of aluminum alloys. This study clearly established that the effects of electromagnetic fields are inherently directional and cannot be interpreted solely as a universal damping mechanism. However, the analysis was primarily phenomenological, focusing on process outcomes such as porosity reduction. The underlying instability mechanism explaining why different magnetic-field orientations produced fundamentally different cavity-collapse behaviors remained unresolved.
                - generic [ref=e244]: Thus, previous experimental and numerical studies have demonstrated that magnetic fields can significantly alter melt-pool dynamics and pore-defect formation [69,70]. However, the effects of magnetic fields were predominantly interpreted in terms of overall keyhole stabilization or pore-defect suppression, rather than through the interaction of magnetic fields with evolving melt flow [71,72]. Consequently, the role of the Lorentz force in laser metal melting remains insufficiently understood, particularly regarding its coupling with the melt-pool flow that governs keyhole stability and pore-defect formation. Despite the development of increasingly sophisticated multiphysics models, the effects of electromagnetic fields are still predominantly characterized in terms of magnitude-dependent features, such as convection damping or enhancement. Most previous studies implicitly adopted a magnitude-based interpretation, in which increasing magnetic-field strength was expected to monotonically enhance stability or suppress pore-defect formation. However, experimental observations reported in the literature have revealed that magnetic fields of comparable intensity can produce markedly different melt-pool flow and defect outcomes depending on their orientation. This result suggests that magnetic-field intensity alone is insufficient to explain keyhole stability and highlights the need for a mechanistic framework that incorporates magnetic-field orientation. The interaction between Lorentz forces with different orientations and recirculating melt has not yet been systematically examined from the perspective of instability transition, recirculation topology, and cavity collapse dynamics.
                - generic [ref=e245]: A key unresolved question is whether keyhole stability depends on the magnitude of the Lorentz forces or on their direction with respect to the dominant recirculation melt-flow patterns that govern cavity collapse. In this regard, previous studies largely focused on field intensity, implicitly assuming monotonic keyhole stabilization with increasing magnetic-field strength [[73], [74], [75], [76]]. The role of Lorentz force–melt flow alignment in keyhole stabilization or destabilization has not been systematically investigated. We hypothesize that the stabilization effect of Lorentz forces on the keyhole is strongly influenced by the alignment between the force and the dominant recirculation melt-flow patterns responsible for rear-wall collapse, rather than solely by the magnetic-field magnitude.
                - generic [ref=e246]: This article introduces the Lorentz-force alignment as a factor governing keyhole instability in high-energy-density laser metal melting. We use multiphysics simulations to identify three characteristic configurations of Lorentz force–melt flow alignment. We show that cavity collapse is suppressed when Lorentz forces counteract rear-wall-directed recirculation, leading to a stable keyhole morphology with near elimination of pore formation. Conversely, the co-alignment of the Lorentz force and melt flow further destabilizes the momentum flux, accelerating collapse events. Orthogonal Lorentz force–melt flow alignment induces lateral momentum redistribution without fully suppressing the dominant recirculation melt-flow patterns. These findings establish that the relative orientation between Lorentz-force-induced momentum and the dominant recirculation melt-flow momentum responsible for rear-wall collapse governs keyhole instability. Unlike previous studies that primarily associated flow damping, convection suppression, or heat redistribution with magnetic-field intensity, the present work identifies the Lorentz-force alignment as the key factor linking magnetic-field orientation to keyhole stability, cavity collapse behavior, and pore-defect formation. Our study contributes to developing a generalized pathway for pore-defect formation control in keyhole-driven metal melting during high-energy-density laser processing.
                - generic [ref=e247]: The remainder of this paper is structured as follows. Section 2 describes the multiphysics model incorporating Lorentz force used for analyzing keyhole dynamics during laser meltal melting. Section 3 presents the results and provides an in-depth discussion of the role of the Lorentz-force alignment in governing melt-pool flow and keyhole stability through the interaction of the force with intrinsic instability modes. Section 4 summarizes the main findings and outlines perspectives for future work.
